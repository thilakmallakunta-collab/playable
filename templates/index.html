<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor — Colors, Text &amp; Images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- Header -->
<header class="app-header">
    <h1>VideoForge</h1>
    <div class="header-actions">
        <button id="export-btn" class="btn btn-primary" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Export Video
        </button>
    </div>
</header>

<!-- Upload Screen -->
<div id="upload-screen" class="upload-screen">
    <div id="upload-zone" class="upload-zone">
        <div class="upload-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        </div>
        <h2>Upload Your Competition Video</h2>
        <p>Drag &amp; drop your video file here, or click to browse</p>
        <p class="formats">Supported: MP4, MOV, AVI, MKV, WebM &bull; Max 500 MB</p>
    </div>
    <input type="file" id="file-input" accept="video/*" hidden>
</div>

<!-- Editor -->
<div id="editor" class="editor">

    <!-- Preview Area -->
    <div class="preview-area">
        <div class="preview-container">
            <div class="video-wrapper">
                <video id="preview-video" preload="auto"></video>
                <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
            </div>
        </div>
        <div class="timeline">
            <button id="play-btn" class="play-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5,3 19,12 5,21"/>
                </svg>
            </button>
            <input type="range" id="timeline-slider" class="timeline-slider" min="0" max="100" step="0.01" value="0">
            <span id="time-display" class="time-display">0:00 / 0:00</span>
        </div>
    </div>

    <!-- Side Panel -->
    <div class="side-panel">
        <div class="panel-tabs">
            <button class="panel-tab active" data-tab="colors">Colors</button>
            <button class="panel-tab" data-tab="text">Text</button>
            <button class="panel-tab" data-tab="images">Images</button>
        </div>

        <div id="panel-content" class="panel-content">

            <!-- Colors Section -->
            <div id="section-colors" class="panel-section active">
                <div class="control-group">
                    <label>Brightness <span>0</span></label>
                    <input id="color-brightness" type="range" class="slider-input" min="-100" max="100" value="0" step="1">
                </div>
                <div class="control-group">
                    <label>Contrast <span>0</span></label>
                    <input id="color-contrast" type="range" class="slider-input" min="-100" max="100" value="0" step="1">
                </div>
                <div class="control-group">
                    <label>Saturation <span>0</span></label>
                    <input id="color-saturation" type="range" class="slider-input" min="-100" max="100" value="0" step="1">
                </div>
                <div class="control-group">
                    <label>Hue Rotate <span>0°</span></label>
                    <input id="color-hueRotate" type="range" class="slider-input" min="0" max="360" value="0" step="1">
                </div>

                <div class="divider"></div>
                <p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600">Channel Gamma</p>

                <div class="control-group">
                    <label>Red <span>1.00</span></label>
                    <input id="color-gammaR" type="range" class="slider-input" min="0.1" max="3" value="1" step="0.05">
                </div>
                <div class="control-group">
                    <label>Green <span>1.00</span></label>
                    <input id="color-gammaG" type="range" class="slider-input" min="0.1" max="3" value="1" step="0.05">
                </div>
                <div class="control-group">
                    <label>Blue <span>1.00</span></label>
                    <input id="color-gammaB" type="range" class="slider-input" min="0.1" max="3" value="1" step="0.05">
                </div>

                <div style="text-align:center;margin-top:16px">
                    <button id="reset-colors" class="reset-link">Reset all to defaults</button>
                </div>
            </div>

            <!-- Text Section -->
            <div id="section-text" class="panel-section">
                <div id="text-list"></div>
                <div class="add-btn-area">
                    <button class="btn btn-secondary" onclick="App.addText()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Text Overlay
                    </button>
                </div>
            </div>

            <!-- Images Section -->
            <div id="section-images" class="panel-section">
                <div id="image-list"></div>
                <div class="add-btn-area">
                    <button class="btn btn-secondary" onclick="App.addImage()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Image Overlay
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Export Modal -->
<div id="export-modal" class="modal-backdrop">
    <div class="modal">
        <h3 id="modal-title">Exporting...</h3>
        <p id="modal-text">Processing your video...</p>
        <div class="progress-bar-container">
            <div id="modal-progress" class="progress-bar"></div>
        </div>
        <div id="modal-actions"></div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
